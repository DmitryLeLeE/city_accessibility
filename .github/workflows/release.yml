name: Release desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (создастся, если его нет), например v1.0.0'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: --win
            required: true
            cache: |
              ~\AppData\Local\electron\Cache
              ~\AppData\Local\electron-builder\Cache
          - os: ubuntu-latest
            name: linux
            args: --linux
            required: false
            cache: |
              ~/.cache/electron
              ~/.cache/electron-builder
          - os: macos-latest
            name: macos
            args: --mac
            required: false
            cache: |
              ~/Library/Caches/electron
              ~/Library/Caches/electron-builder
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'   # electron-builder сам скачает нужный Electron
      # Кэш бинарников Electron/electron-builder: github.com/releases иногда отвечает 504,
      # поэтому уже скачанное сохраняется даже при неудачной сборке и подхватывается следующим запуском.
      - uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.cache }}
          key: eb-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: eb-${{ matrix.name }}-
      - name: Build installers (с повторами при сбоях загрузки)
        shell: bash
        run: |
          for i in 1 2 3 4 5 6; do
            npx electron-builder ${{ matrix.args }} --publish never && exit 0
            echo "Попытка $i не удалась, повтор через $((i * 45)) с"; sleep $((i * 45))
          done
          exit 1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # без подписи кода
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ matrix.cache }}
          key: eb-${{ matrix.name }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.dmg
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ always() && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: release, pattern: desktop-*, merge-multiple: true }
      - run: ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: release/*
          generate_release_notes: true
          body: |
            Десктопная версия City Accessibility — тот же расчёт, что и на сайте, но в отдельном окне; данные берутся из OpenStreetMap по мере необходимости.

            - **Windows:** `CityAccessibility-Setup-*.exe` — установщик; `CityAccessibility-Portable-*.exe` — без установки.
            - **Linux:** `.AppImage` (`chmod +x`, затем запуск).
            - **macOS:** `.dmg` (сборка не подписана: первый запуск — через правый клик → «Открыть»).

            Приложения не подписаны цифровой подписью: Windows SmartScreen может показать предупреждение — «Подробнее» → «Выполнить в любом случае».
